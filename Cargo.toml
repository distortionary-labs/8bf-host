[package]
name = "eightbf-host"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Run Photoshop-compatible filter plug-ins (.8bf) from the command line or over HTTP"
license = "MIT OR Apache-2.0"
authors = ["Durable Programming, LLC <contact@durableprogramming.com>"]
repository = "https://github.com/distortionary-labs/8bf-host"
documentation = "https://docs.rs/eightbf-host"
readme = "README.md"
keywords = ["photoshop", "8bf", "filter", "plugin", "image"]
categories = ["command-line-utilities", "multimedia::images"]
exclude = ["/ref", "/external", "/fuzz"]

[lib]
name = "eightbf_host"
path = "src/lib.rs"

[[bin]]
name = "8bf-host"
path = "src/main.rs"

[features]
# Use the Windows `#pragma pack(4)` FilterRecord layout on every platform.
# Only the test suite needs this: it lets Linux check both layouts against
# the C test filter compiled with -DPACK4.
pack4 = []

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
ctrlc = "3"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp", "pnm", "bmp"] }
libloading = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
toml = "0.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Wdk_System_Threading",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_Controls_Dialogs",
] }

[dev-dependencies]
assert_cmd = "2"
http-body-util = "0.1"
predicates = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
# panic = "abort" is deliberately left out. Host callbacks are called from
# foreign filter code; they catch panics and turn them into error codes so a
# host bug fails one filter run instead of killing the process.

[package.metadata.deb]
maintainer = "Durable Programming, LLC <contact@durableprogramming.com>"
copyright = "2026, Durable Programming, LLC"
license-file = ["LICENSE-MIT", "4"]
section = "graphics"
priority = "optional"
assets = [
  ["target/release/8bf-host", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/8bf-host/", "644"],
  ["docs/*.md", "usr/share/doc/8bf-host/docs/", "644"],
  ["config.example.toml", "usr/share/doc/8bf-host/", "644"],
  ["LICENSE-MIT", "usr/share/doc/8bf-host/", "644"],
  ["LICENSE-APACHE", "usr/share/doc/8bf-host/", "644"],
]

[package.metadata.generate-rpm]
assets = [
  { source = "target/release/8bf-host", dest = "/usr/bin/8bf-host", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/8bf-host/README.md", mode = "644" },
  { source = "docs/*.md", dest = "/usr/share/doc/8bf-host/docs/", mode = "644" },
  { source = "config.example.toml", dest = "/usr/share/doc/8bf-host/config.example.toml", mode = "644" },
  { source = "LICENSE-MIT", dest = "/usr/share/doc/8bf-host/LICENSE-MIT", mode = "644" },
  { source = "LICENSE-APACHE", dest = "/usr/share/doc/8bf-host/LICENSE-APACHE", mode = "644" },
]
