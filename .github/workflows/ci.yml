name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.read.outputs.channel }}
    steps:
      - uses: actions/checkout@v4
      - name: Read channel from rust-toolchain.toml
        id: read
        run: |
          channel=$(sed -n 's/^channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml)
          if [[ -z $channel ]]; then
            echo "no channel found in rust-toolchain.toml" >&2
            exit 1
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  # Fast checks first: formatting and lints on every platform we build for.
  lint:
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          components: clippy, rustfmt
          targets: x86_64-pc-windows-gnu, aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --features pack4 -- -D warnings
      - run: cargo clippy --all-targets --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo clippy --all-targets --target aarch64-apple-darwin -- -D warnings
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  # The test filter is compiled in both FilterRecord layouts.
  test:
    runs-on: ${{ matrix.os }}
    needs: toolchain
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test
      - run: cargo test --features pack4

  # Windows itself, with the same target as the release. MinGW's gcc on the
  # runner links the host and builds the test filter as a DLL. Windows always
  # uses the pack(4) layout, so there is no separate pack4 run.
  windows:
    runs-on: windows-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      # Without a compiler the filter tests skip instead of failing.
      - run: gcc --version
      - run: cargo test --target x86_64-pc-windows-gnu

  # Windows filters on Linux: build the Windows worker and run it under Wine.
  wine:
    runs-on: ubuntu-latest
    needs: toolchain
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - run: cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Install Wine
        run: sudo apt-get update && sudo apt-get install -y wine64
      - name: Build the Windows worker
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nexec zig dlltool "$@"\n' > "$HOME/.local/bin/x86_64-w64-mingw32-dlltool"
          chmod +x "$HOME/.local/bin/x86_64-w64-mingw32-dlltool"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          PATH="$HOME/.local/bin:$PATH" cargo zigbuild --release --target x86_64-pc-windows-gnu
      - name: Run the Wine tests
        env:
          WINEDEBUG: -all
          EIGHTBF_HOST_TEST_WINE_WORKER: ${{ github.workspace }}/target/x86_64-pc-windows-gnu/release/8bf-host.exe
          EIGHTBF_HOST_TEST_WINE: wine
        run: |
          wineboot --init || true
          cargo test --test wine

  # Everything below runs only for a v* tag, after every check above passes.
  # bin/release creates and pushes that tag.

  # Static Linux binaries and both Windows builds, cross-compiled.
  release-build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [toolchain, lint, test, windows, wine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu, i686-pc-windows-gnu
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.1
      - run: cargo install --locked cargo-zigbuild --version 0.23.4
      - name: Build
        run: |
          mkdir -p "$HOME/.local/bin"
          for arch in x86_64 i686; do
            printf '#!/bin/sh\nexec zig dlltool "$@"\n' > "$HOME/.local/bin/$arch-w64-mingw32-dlltool"
            chmod +x "$HOME/.local/bin/$arch-w64-mingw32-dlltool"
          done
          export PATH="$HOME/.local/bin:$PATH"
          cargo zigbuild --release --target x86_64-unknown-linux-musl
          cargo zigbuild --release --target aarch64-unknown-linux-musl
          cargo zigbuild --release --target x86_64-pc-windows-gnu
          cargo zigbuild --release --target i686-pc-windows-gnu
      - name: Collect
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          cp target/x86_64-unknown-linux-musl/release/8bf-host "dist/8bf-host-$version-linux-x64"
          cp target/aarch64-unknown-linux-musl/release/8bf-host "dist/8bf-host-$version-linux-arm64"
          cp target/x86_64-pc-windows-gnu/release/8bf-host.exe "dist/8bf-host-$version-win-x64.exe"
          cp target/i686-pc-windows-gnu/release/8bf-host.exe "dist/8bf-host-$version-win-x86.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux-windows
          path: dist/*

  # The universal macOS binary, built on a Mac with Apple's own SDK. The
  # linker ad-hoc signs the arm64 half so it starts on Apple silicon.
  release-build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [toolchain, lint, test, windows, wine]
    runs-on: macos-latest
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release --target aarch64-apple-darwin
      - run: cargo build --release --target x86_64-apple-darwin
      - name: Combine
        run: |
          version=${GITHUB_REF_NAME#v}
          mkdir dist
          lipo -create -output "dist/8bf-host-$version-macos-universal" \
            target/aarch64-apple-darwin/release/8bf-host \
            target/x86_64-apple-darwin/release/8bf-host
          lipo -info "dist/8bf-host-$version-macos-universal"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: dist/*

  # The GitHub release, with checksums and the version's CHANGELOG section as
  # its notes. Also publishes to crates.io when CARGO_REGISTRY_TOKEN is set.
  release:
    needs: [toolchain, release-build, release-build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Check the tag against Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi
      - name: Write release notes
        run: |
          version=${GITHUB_REF_NAME#v}
          awk -v v="$version" '
            index($0, "## " v " ") == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [[ ! -s notes.md ]]; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          chmod +x dist/*
          (cd dist && sha256sum ./* > SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "8bf-host ${GITHUB_REF_NAME#v}" --notes-file notes.md
      - uses: dtolnay/rust-toolchain@master
        if: env.CARGO_REGISTRY_TOKEN != ''
        with:
          toolchain: ${{ needs.toolchain.outputs.channel }}
      - name: Publish to crates.io
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: cargo publish --locked
